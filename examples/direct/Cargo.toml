[package]
name = "direct"
version = "0.1.0"
edition = "2024"

[features]
default = ["client"]
server = []
client = []


[dependencies]
macroni = { path = "../..", default-features = false, features = ["client"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
