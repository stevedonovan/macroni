[package]
name = "macroni"
description = "Macros for generating Axum handlers from async methods"
license = "MIT"
version = "0.2.0"
edition = "2024"
autobins = false

[workspace]
members = [
    "macroni-macros",
    "examples/api",
    "examples/client",
    "examples/server", "examples/hello",
]

[features]
default = ["client", "server"]
client = ["dep:percent-encoding", "dep:reqwest"]
server = ["dep:axum", "dep:tokio", "dep:tracing"]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", optional = true }
http = "1"
macroni-macros = { version = "0.2.0", path = "macroni-macros" }
percent-encoding = { version = "2.3", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", optional = true, features = ["full"] }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
trybuild = "1.0"
